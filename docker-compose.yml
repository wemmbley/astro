version: "3.9"

services:
  # ---------------- FRONTEND ----------------
  frontend:
    build: ./apps/frontend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true

  # ---------------- LARAVEL GATEWAY ----------------
  gateway:
    build: ./apps/gateway
    ports:
      - "8000:9000"
    volumes:
      - ./apps/gateway:/var/www
      - ./infra/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
      - flask

  # ---------------- FLASK API ----------------
  flask:
    build: ./apps/python-api
    ports:
      - "5000:5000"
    volumes:
      - ./apps/python-api:/app

  # ---------------- MYSQL ----------------
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf

  # ---------------- PHPMYADMIN ----------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

  # ---------------- NGINX (gateway proxy) ----------------
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - gateway
      - flask

volumes:
  mysql_data: