version: "3.9"

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  laravel:
    build:
      context: ./apps/laravel
      dockerfile: ../../infra/docker/laravel.Dockerfile
    ports:
      - "8000:9000"
    volumes:
      - ./apps/laravel:/var/www
      - ./infra/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
      - flask

  flask:
    build:
      context: .
      dockerfile: ./infra/docker/flask.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./apps/flask:/app

  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - laravel
      - flask

volumes:
  mysql_data:
  frontend_node_modules: