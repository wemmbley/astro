events {}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream laravel {
        server laravel:9000;
    }

    upstream flask {
        server flask:5000;
    }

    server {
        listen 80;

        # React
        location / {
            proxy_pass http://frontend;
        }

        # Laravel API
        location /api/ {
            proxy_pass http://laravel;
        }

        # Flask API
        location /ml/ {
            proxy_pass http://flask;
        }
    }
}